name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Lint, types, tests and production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke

  database:
    name: PostgreSQL 17 schema and role isolation
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - name: Start isolated PostgreSQL 17 and Auth
        run: supabase start --exclude imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Replay migrations from an empty database
        run: supabase db reset --local --no-seed
      - name: Lint database functions
        run: supabase db lint --local --schema public,private --fail-on warning
      - name: Test all database roles
        run: supabase test db --local
      - name: Test native Auth session binding
        run: npm run test:auth
      - name: Test native TV pairing and persistent display sessions
        run: npm run test:tv
      - name: Test native private Realtime and live engine
        run: npm run test:live
      - name: Test native facilitator controls, notices and late answers
        run: npm run test:controls
      - name: Test that an AI claim never marks an answer seen that its run did not read
        run: npm run test:ai-claim-race
      - name: Test the room lock, stale votes and the follow-up poll
        run: npm run test:submit-lock
      - name: Test that nightly practice reset skips a concurrent room operation
        run: npm run test:practice-reset-lock
      - name: Test Team Hub reader against a disposable fixture only
        run: npm run test:team-hub
      - name: Test idempotent seeds and native practice sign-in/reset
        run: npm run test:practice
      - name: Build the app for the browser failure kit
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Install the pinned Playwright Chromium
        # The system packages come from Ubuntu's archive. When it can't be reached, the runner image's own
        # libraries are enough for Chromium, so install the browser alone rather than fail before any test runs.
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Make the screenshot folder for the kits
        run: mkdir -p "${{ runner.temp }}/kit-shots"
      - name: Test file backup recovery and private client error monitoring
        run: npm run test:operations
        env:
          KIT_SHOTS: ${{ runner.temp }}/kit-shots
      - name: Upload operations layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-screens
          path: ${{ runner.temp }}/kit-shots/operations-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the failure states in real browsers (milestone 2, then the kinds and failures of milestones 3 to 7)
        run: npm run test:browser
        env:
          KIT_SHOTS: ${{ runner.temp }}/kit-shots
      - name: Run the load script (50 simulated phones) against the latency log
        run: npm run test:load
      - name: Test the content screens and the pass 3 chrome in real browsers
        run: npm run test:content
      - name: Test the bar family (choice, scale, ranking, 100 points, statements) in real browsers
        run: npm run test:bars
      - name: Test the 2x2 grid, private form and sign together with 50 simulated phones in real browsers
        run: npm run test:grid-form-sign
      - name: Test Q&A (INT-03) on a paired TV, phones and 50 simulated phones in real browsers
        run: npm run test:qa
      - name: Test self-paced sessions, Clear test answers, export and the recap with 50 simulated phones in real browsers
        run: npm run test:self-paced
      - name: Test the drag-to-build run of show and templates (SET-07, SET-08) with a template run on a TV and phone
        run: npm run test:templates
      - name: Test AI, live (combine, groups, summary, folds, FAIL-09) with the fake model and 50 simulated phones in real browsers
        run: npm run test:ai
      - name: Run a team workshop end to end from the template (rehearse, clear, eight phones, every session, export, recap) in real browsers
        run: mkdir -p team-workshop-shots && npm run test:team-workshop
        env:
          KIT_SHOTS: team-workshop-shots
      - name: Upload the team workshop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-workshop-screens
          path: team-workshop-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test every kind through the live-screen rules with 50 simulated phones (milestone 3 acceptance)
        run: npm run test:acceptance-live
        env:
          KIT_SHOTS: ${{ runner.temp }}/kit-shots
      - name: Test Outcome bullets (typed letter by letter) and Outcome confirm with 50 simulated phones in real browsers
        run: npm run test:outcomes
      - name: Test the scribe console (capture, easel photos, offline replay, team-led off) in real browsers with Storage
        run: npm run test:scribe
        env:
          KIT_SHOTS: ${{ runner.temp }}/kit-shots
      - name: Test the overnight drafts and review (Day 1 close, sources, locks, restore, versions, publish, failed draft) in real browsers
        run: npm run test:overnight
        env:
          KIT_SHOTS: ${{ runner.temp }}/kit-shots
      - name: Upload the acceptance and failure kit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-screenshots
          path: ${{ runner.temp }}/kit-shots
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the Pre-mortem and the CORE goal builder with the fake model and 50 simulated phones in real browsers (milestone 4, step 5)
        run: mkdir -p ${{ runner.temp }}/premortem-goals-shots && npm run test:premortem-goals
        env:
          KIT_SHOTS: ${{ runner.temp }}/premortem-goals-shots
      - name: Upload the Pre-mortem and goals screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premortem-goals-screens
          path: ${{ runner.temp }}/premortem-goals-shots
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the remote changing hands, commander's intent and the follow-up access in real browsers
        run: mkdir -p handover-intent-shots && npm run test:handover-intent
        env:
          KIT_SHOTS: handover-intent-shots
      - name: Upload the handover and intent screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handover-intent-screens
          path: handover-intent-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the Wayfinding templates and the draft Clearway Map in a real browser
        run: mkdir -p map-templates-shots && npm run test:map-templates
        env:
          KIT_SHOTS: map-templates-shots
      - name: Upload the Map and template screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-templates-screens
          path: map-templates-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the lens wall (INT-12) with AI clusters and 50 simulated phones in a real browser
        if: ${{ !cancelled() }}
        run: mkdir -p lens-wall-shots && npm run test:lens-wall
        env:
          KIT_SHOTS: lens-wall-shots
      - name: Upload the lens wall screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lens-wall-screens
          path: lens-wall-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the lens summary (INT-18) with AI drafts and folds and 50 simulated phones in a real browser
        if: ${{ !cancelled() }}
        run: mkdir -p lens-summary-shots && npm run test:lens-summary
        env:
          KIT_SHOTS: lens-summary-shots
      - name: Upload the lens summary screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lens-summary-screens
          path: lens-summary-shots/
      - name: Test the Day 2 read-back (D2-03, INT-14) with corrections, AI folds and 50 simulated phones in a real browser
        if: ${{ !cancelled() }}
        run: mkdir -p read-back-shots && npm run test:read-back
        env:
          KIT_SHOTS: read-back-shots
      - name: Upload the read-back screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-back-screens
          path: read-back-shots/
      - name: Test candidate priorities (INT-13) with AI, suggestions, 100 points and 50 simulated phones in a real browser
        if: ${{ !cancelled() }}
        run: mkdir -p candidates-shots && npm run test:candidates
        env:
          KIT_SHOTS: candidates-shots
      - name: Upload the candidate priorities screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidates-screens
          path: candidates-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test milestone 4 acceptance (every Wayfinding kind, 50 simulated phones, frame sampling)
        if: ${{ !cancelled() }}
        run: mkdir -p acceptance-m4-shots && npm run test:acceptance-m4
        env:
          KIT_SHOTS: acceptance-m4-shots
      - name: Upload the milestone 4 acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-m4-screens
          path: acceptance-m4-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test promoting a scribe quote to the TV (anonymous, over a live word cloud, no blank frame, replace, take down, long quotes) in real browsers
        if: ${{ !cancelled() }}
        run: mkdir -p promoted-quote-shots && npm run test:promoted-quote
        env:
          KIT_SHOTS: promoted-quote-shots
      - name: Upload the promoted quote screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promoted-quote-screens
          path: promoted-quote-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the Riverside Wayfinding retreat end to end in real browsers
        if: ${{ !cancelled() }}
        run: mkdir -p wayfinding-shots && npm run test:wayfinding
        env:
          KIT_SHOTS: wayfinding-shots
      - name: Upload the Wayfinding retreat screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayfinding-screens
          path: wayfinding-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test Discover setup (survey findings, notes by paste and file, who can reach it) in a real browser
        if: ${{ !cancelled() }}
        run: mkdir -p discover-shots && npm run test:discover
        env:
          KIT_SHOTS: discover-shots
      - name: Upload the Discover screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-screens
          path: discover-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the Four Helpful Lists with 50 simulated phones in real browsers
        if: ${{ !cancelled() }}
        run: mkdir -p four-lists-shots && npm run test:four-lists
        env:
          KIT_SHOTS: four-lists-shots
      - name: Upload the Four Helpful Lists screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-lists-screens
          path: four-lists-shots/
      - name: Test Discover themes (draft, accept, rename, merge, reject, redraft, slow and failed AI, who can reach it) in a real browser
        if: ${{ !cancelled() }}
        run: mkdir -p themes-shots && npm run test:themes
        env:
          KIT_SHOTS: themes-shots
      - name: Upload the Discover themes screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themes-screens
          path: themes-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test What We Heard (draft from accepted themes, edit, apply into the step, nothing accepted, slow and failed AI, who can reach it) in a real browser
        if: ${{ !cancelled() }}
        run: mkdir -p heard-shots && npm run test:what-we-heard
        env:
          KIT_SHOTS: heard-shots
      - name: Upload the What We Heard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: what-we-heard-screens
          path: heard-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the alignment signal (cards on the control surface and the remote, nothing on the TV or phones, dismiss, citation, neutral question, laptop closed) in a real browser
        if: ${{ !cancelled() }}
        run: mkdir -p signal-shots && npm run test:signal
        env:
          KIT_SHOTS: signal-shots
      - name: Upload the alignment signal screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-screens
          path: signal-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test milestone 6 acceptance (Four Helpful Lists with 50 simulated phones, Discover, What We Heard, the alignment signal and the neutral question, frame sampling)
        if: ${{ !cancelled() }}
        run: mkdir -p acceptance-m6-shots && npm run test:acceptance-m6
        env:
          KIT_SHOTS: acceptance-m6-shots
      - name: Upload the milestone 6 acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-m6-screens
          path: acceptance-m6-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the check-ins (scheduled run at 30, 60 and 90 days into the harness mailbox, the phone page offline, results and follow-ups, Send now) in a real browser
        if: ${{ !cancelled() }}
        run: mkdir -p check-ins-shots && npm run test:check-ins
        env:
          KIT_SHOTS: check-ins-shots
      - name: Upload the check-ins screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-ins-screens
          path: check-ins-shots/
      - name: Test the read-only copy (sharing waits for Day 2, Close the day, a named link shown once, laptop and phone, no inputs, the report only after sign-off, owner status, revoke, nothing private in the page) in a real browser
        if: ${{ !cancelled() }}
        run: mkdir -p read-only-shots && npm run test:read-only
        env:
          KIT_SHOTS: read-only-shots
      - name: Upload the read-only screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-only-screens
          path: read-only-shots/
      - name: Test the Wayfinding report (draft all 14 sections, sources and the lit words, the aligned signal as a source, edit, the room's words, redraft, a section the model fails on, sign-off, the Word and PDF export, who can reach it) in a real browser
        if: ${{ !cancelled() }}
        run: mkdir -p report-shots && npm run test:report
        env:
          KIT_SHOTS: report-shots
      - name: Upload the Wayfinding report screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-screens
          path: report-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the visibility plan (draft in the outward order, sources, edit, review, the public date, add and move and remove, redraft keeps what was touched, a model failure, the report's table, who can reach it) in a real browser
        if: ${{ !cancelled() }}
        run: mkdir -p plan-shots && npm run test:visibility-plan
        env:
          KIT_SHOTS: plan-shots
      - name: Upload the visibility plan screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-screens
          path: plan-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: "Test milestone 7 acceptance (after the retreat on Riverside end to end: Close the day, the report, sign-off, Word and PDF, the visibility plan, a share link on a phone and a laptop then revoked, the 30-day check-in by the scheduled run, every owner answering, results, owner status on the copy)"
        if: ${{ !cancelled() }}
        run: mkdir -p acceptance-m7-shots && npm run test:acceptance-m7
        env:
          KIT_SHOTS: acceptance-m7-shots
      - name: Upload the milestone 7 acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-m7-screens
          path: acceptance-m7-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test milestone 5 acceptance (scribe, promoted quote, overnight drafts, Day 2 read-back; 50 simulated phones, frame sampling)
        if: ${{ !cancelled() }}
        run: mkdir -p acceptance-m5-shots && npm run test:acceptance-m5
        env:
          KIT_SHOTS: acceptance-m5-shots
      - name: Upload the milestone 5 acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-m5-screens
          path: acceptance-m5-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
