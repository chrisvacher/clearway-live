name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Lint, types, tests and production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke

  database:
    name: PostgreSQL 17 schema and role isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - name: Start isolated PostgreSQL 17 and Auth
        run: supabase start --exclude storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Replay migrations from an empty database
        run: supabase db reset --local --no-seed
      - name: Lint database functions
        run: supabase db lint --local --schema public,private --fail-on warning
      - name: Test all database roles
        run: supabase test db --local
      - name: Test native Auth session binding
        run: npm run test:auth
      - name: Test native TV pairing and persistent display sessions
        run: npm run test:tv
      - name: Test native private Realtime and live engine
        run: npm run test:live
      - name: Test Team Hub reader against a disposable fixture only
        run: npm run test:team-hub
      - name: Test idempotent seeds and native practice sign-in/reset
        run: npm run test:practice
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
