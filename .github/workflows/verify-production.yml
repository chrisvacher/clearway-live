      - name: Install the pinned Playwright Chromium
        run: npx playwright install --with-deps chromium || npx playwright install chromium
        id: chromium
      - name: Test the drag-to-build run of show and templates (SET-07, SET-08) with a template run on a TV and phone
        run: npm run test:templates 2>&1 | tee "$RUNNER_TEMP/check-templates.log"
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        shell: bash
      - name: Run a team workshop end to end from the template (rehearse, clear, eight phones, every session, export, recap) in real browsers
        run: mkdir -p team-workshop-shots && npm run test:team-workshop 2>&1 | tee "$RUNNER_TEMP/check-team-workshop.log"
        env:
          KIT_SHOTS: team-workshop-shots
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        shell: bash
      - name: Run one Novetera workshop end to end (two addresses, four ways in, emails, the Word summary, switching back) and read every Novetera surface for the word Clearway
        run: mkdir -p novetera-workshop-shots && npm run test:novetera-workshop 2>&1 | tee "$RUNNER_TEMP/check-novetera-workshop.log"
        env:
