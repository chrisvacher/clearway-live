name: Complete deployed revision 2a982df checks
on:
  push:
    branches:
      - codex/verify-production-2a982df-late
permissions:
  contents: read
jobs:
  four_lists:
    name: four lists
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a982df2bf49d99aa8a0f3ceefc0a02d5615a31b
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - name: Start isolated PostgreSQL 17 and Auth
        run: supabase start --exclude imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Replay migrations from an empty database
        run: supabase db reset --local --no-seed
      - name: Test idempotent seeds and native practice sign-in/reset
        run: npm run test:practice
        id: seed
      - name: Build the app for the browser failure kit
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        id: app
      - name: Install the pinned Playwright Chromium
        run: npx playwright install --with-deps chromium || npx playwright install chromium
        id: chromium
      - name: Test the Four Helpful Lists with 50 simulated phones in real browsers
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: mkdir -p four-lists-shots && npm run test:four-lists 2>&1 | tee "$RUNNER_TEMP/check-four-lists.log"
        env:
          KIT_SHOTS: four-lists-shots
        shell: bash
      - name: Upload check logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: four_lists-logs
          path: ${{ runner.temp }}/check-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
  discover:
