        uses: actions/upload-artifact@v4
        with:
          name: room_interactions-logs
          path: ${{ runner.temp }}/check-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
  workshop:
    name: workshop
    runs-on: ubuntu-latest
    timeout-minutes: 50
