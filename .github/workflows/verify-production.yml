      - name: Build the app for the browser failure kit
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        id: app
      - name: Install the pinned Playwright Chromium
        run: npx playwright install --with-deps chromium || npx playwright install chromium
        id: chromium
      - name: Test self-paced sessions, Clear test answers, export and the recap with 50 simulated phones in real browsers
        run: npm run test:self-paced 2>&1 | tee "$RUNNER_TEMP/check-self-paced.log"
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        shell: bash
      - name: Test AI, live (combine, groups, summary, folds, FAIL-09) with the fake model and 50 simulated phones in real browsers
        run: npm run test:ai 2>&1 | tee "$RUNNER_TEMP/check-ai.log"
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        shell: bash
      - name: Test small-room word clouds and open text on paired TVs in both skins, themes and motion settings
        run: npm run test:small-room 2>&1 | tee "$RUNNER_TEMP/check-small-room.log"
        env:
          KIT_SHOTS: ${{ runner.temp }}/small-room-shots
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        shell: bash
      - name: Test Outcome bullets (typed letter by letter) and Outcome confirm with 50 simulated phones in real browsers
        run: npm run test:outcomes 2>&1 | tee "$RUNNER_TEMP/check-outcomes.log"
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        shell: bash
      - name: Upload check logs on failure
