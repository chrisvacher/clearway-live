<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><title>TV: Before and after, Clearway</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;family=Public+Sans:wght@400;500;600;700;800&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap">
<style>

body{margin:0}
a{color:#3F72DE}a:hover{color:#03294E}
*{box-sizing:border-box}
/* Room skins: TV and phone tokens */
.sk-cw{--f:'Plus Jakarta Sans',system-ui,sans-serif;--f-ed:'Plus Jakarta Sans',system-ui,sans-serif;--surface:#03294E;--ground:radial-gradient(1500px 1000px at 100% 0%,rgba(63,114,222,.42),rgba(63,114,222,0) 72%),#03294E;--text:#F9F9FB;--muted:#99C5FE;--card:#F9F9FB;--on-card:#03294E;--live:#D2FF71;--on-live:#03294E;--callout:#FFC845;--on-callout:#03294E;--border:rgba(249,249,251,.15);--border-strong:#99C5FE;--accent:#3F72DE;--panel:#3F72DE;--on-panel:#F9F9FB;--bar:#3F72DE;--bar-track:#10396E;--hw:300;--hb:700;--r-card:16px;--r-chip:12px;--r-btn:6px;--btn:#3868D4;--on-btn:#F9F9FB;--btn-case:uppercase;--btn-track:.05em;--ph-bg:#03294E;--ph-text:#F9F9FB;--ph-muted:#99C5FE;--ph-card:#F9F9FB;--ph-on-card:#03294E;--ph-border:rgba(249,249,251,.15);--ph-strong:#99C5FE;--ph-mark:#D2FF71;--ph-input:#F9F9FB}
.sk-nv{--f:'Public Sans',system-ui,sans-serif;--f-ed:'Source Serif 4',Georgia,serif;--surface:#1F2328;--ground:#1F2328;--text:#F7F6F3;--muted:#C6C2BA;--card:#F7F6F3;--on-card:#1F2328;--live:#E78D96;--on-live:#1F2328;--callout:#E5BF6D;--on-callout:#1F2328;--border:rgba(247,246,243,.15);--border-strong:#C6C2BA;--accent:#9A3542;--panel:#454B54;--on-panel:#F7F6F3;--bar:#C6C2BA;--bar-track:#2C3137;--hw:700;--hb:800;--r-card:4px;--r-chip:4px;--r-btn:2px;--btn:#7A1F2B;--on-btn:#FFFFFF;--btn-case:none;--btn-track:0;--ph-bg:#F7F6F3;--ph-text:#1F2328;--ph-muted:#454B54;--ph-card:#FFFFFF;--ph-on-card:#1F2328;--ph-border:#E3E0D9;--ph-strong:#6E747C;--ph-mark:#7A1F2B;--ph-input:#FFFFFF}
/* TV */
.tv{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--ground);color:var(--text);font-family:var(--f);display:flex;flex-direction:column;padding:48px 96px 44px}
.tv-head{display:flex;align-items:center;justify-content:space-between;height:72px;flex:none}
.tv-left,.tv-right{display:flex;align-items:center}
.tv-left{gap:24px}.tv-right{gap:48px}
.church{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 20px 0 8px;border-radius:var(--r-chip);background:var(--card);color:var(--on-card);font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.church i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--on-card);color:var(--card);font-style:normal;font-size:22px;letter-spacing:0}
.sk-nv .church i{border-radius:2px}
.counts{display:inline-flex;gap:12px}
.count,.timer{display:inline-flex;align-items:center;gap:.35em;height:56px;padding:0 .5em 0 .42em;border-radius:var(--r-chip);box-shadow:inset 0 0 0 2px var(--border-strong);font-size:54px;line-height:1;color:var(--muted);white-space:nowrap}
.count svg,.timer svg{width:40px;height:40px;flex:none}
.count b,.timer b{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.timer.is-last,.timer.is-over{box-shadow:inset 0 0 0 3px var(--callout);color:var(--callout)}
.timer.is-last b,.timer.is-over b{color:var(--callout)}
.cw-mark{display:inline-block;width:72px;height:72px;background:var(--live);}
.cw-mark.is-down{background:var(--muted)}
.tv-main{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:28px}
.eyebrow{margin:0;font-size:54px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.sk-nv .eyebrow{font-size:43px}
.hl{margin:0;font-size:96px;line-height:1.1;font-weight:var(--hw);letter-spacing:-.01em}
.hl b{font-weight:var(--hb)}
.hl-xl{margin:0;font-size:144px;line-height:1.06;font-weight:var(--hw);letter-spacing:-.015em}
.hl-xl b{font-weight:var(--hb)}
.tv-foot{flex:none;display:flex;justify-content:space-between;align-items:baseline;min-height:56px;font-size:43px;color:var(--muted)}
.wall{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 860px;gap:56px;padding-top:36px}
.groups{display:flex;flex-direction:column;gap:22px;align-items:flex-start;padding-top:8px}
.ai-line{display:flex;align-items:center;gap:20px;margin:0 0 8px;font-size:46px;font-weight:600}
.ai-ic{width:52px;height:52px;flex:none;color:var(--muted)}
.grp{display:inline-flex;align-items:center;gap:22px;padding:10px 14px 10px 28px;border-radius:var(--r-card);background:var(--panel);color:var(--on-panel);font-size:58px;font-weight:700;max-width:100%}
.grp span{display:inline-grid;place-items:center;min-width:64px;height:64px;padding:0 12px;border-radius:calc(var(--r-card) - 4px);background:var(--surface);color:var(--text);font-size:54px}
.grp.is-small{font-size:50px}
.grp-more{margin:6px 0 0;font-size:54px;color:var(--muted);font-weight:500}
.feed{border-left:2px solid var(--border);padding-left:40px;display:flex;flex-direction:column}
.feed h3{margin:0 0 10px;font-size:44px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.feed p{margin:0;padding:14px 24px;border-bottom:2px solid var(--border);font-size:46px;line-height:1.2;font-weight:500}
.feed p.is-leaving{opacity:.25;transform:scale(.96);transform-origin:left center}
/* Images on the TV */
.slide-box{position:relative;overflow:hidden}
.ground-full{position:absolute;inset:0;background:var(--ground);display:grid;place-items:center}
.tv-corner{position:absolute;right:96px;bottom:40px;display:inline-flex;align-items:center;gap:12px;font-size:24px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:30px;padding-top:40px}
.bar{display:grid;grid-template-columns:560px minmax(0,1fr) 160px;align-items:center;gap:28px;font-size:56px;font-weight:600}
.bar-track{height:64px;background:var(--bar-track);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--bar);border-radius:4px}
.bar.is-lead .bar-fill{background:var(--callout)}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
/* Phones */
.ph{width:390px;height:844px;overflow:hidden;position:relative;background:var(--ph-bg);color:var(--ph-text);font-family:var(--f);display:flex;flex-direction:column}
.ph-head{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;border-bottom:1px solid var(--ph-border);flex:none}
.ph-church{font-size:15px;font-weight:600;color:var(--ph-muted)}
.sk-nv .ph-church{color:var(--ph-muted)}
.ph-right{display:flex;align-items:center;gap:14px}
.ph-mark{width:28px;height:28px;background:var(--ph-mark);}
.ph-timer{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r-btn);box-shadow:inset 0 0 0 1.5px var(--ph-strong);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.ph-timer svg{width:16px;height:16px}
.ph-body{flex:1;min-height:0;padding:22px 16px 16px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.ph-earlier{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--ph-text);text-decoration:underline;padding-left:8px}
.ph-h{margin:0;font-size:26px;line-height:1.2;font-weight:700}
.ph-p{margin:0;font-size:16px;line-height:1.5;color:var(--ph-muted)}
.ph-p b{color:var(--ph-text)}
.ph-img{border-radius:var(--r-btn);overflow:hidden;position:relative;background:var(--surface)}
.ph-note{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;color:var(--ph-muted)}
.ph-card{background:var(--ph-card);color:var(--ph-on-card);border-radius:calc(var(--r-card) - 4px);padding:14px;font-size:17px;border:1px solid var(--ph-border)}
.ph-foot{flex:none;padding:14px 16px 20px;border-top:1px solid var(--ph-border);display:flex;flex-direction:column;gap:10px}
.ph-input{height:96px;border-radius:var(--r-btn);background:var(--ph-input);box-shadow:inset 0 0 0 2px var(--ph-strong);padding:14px;font-size:20px;color:#6B7280}
.ph-btn{height:56px;border-radius:var(--r-btn);background:var(--btn);color:var(--on-btn);display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700;text-transform:var(--btn-case);letter-spacing:var(--btn-track);border:0;font-family:var(--f);width:100%}
.ph-opt{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-radius:var(--r-btn);background:var(--ph-card);color:var(--ph-on-card);font-size:17px;font-weight:600;border:1px solid var(--ph-border)}
.ph-opt i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ph-strong)}
/* Control surface: Clearway Live app */
.app{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#03294E;background:#FFFFFF;min-height:100%;width:100%;font-size:15px}
.app button,.remote button{font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 18px;border-radius:8px;border:1px solid #D1D5DB;background:#FFFFFF;color:#03294E;font-size:15px;font-weight:600;white-space:nowrap;cursor:pointer}
.btn svg{width:18px;height:18px;flex:none}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.xs{height:32px;padding:0 10px;font-size:13px;gap:6px}
.btn.xs svg{width:15px;height:15px}
.btn.primary{background:#3F72DE;border-color:#3F72DE;color:#FFFFFF}
.btn.go{border:2px solid #A6D23E;color:#03294E}
.btn.prev{border:2px solid #3F72DE}
.btn.on{background:#E6F0FF;border-color:#99C5FE}
.btn.quiet{border-color:transparent;background:transparent;text-decoration:underline}
.btn:disabled{opacity:.5}
.app-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 24px;border-bottom:1px solid #E5E7EB}
.app-top>.row{max-width:760px;justify-content:flex-end;gap:10px}
.app-crumb{display:flex;align-items:center;gap:16px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.app-title{margin:4px 0 2px;font-size:26px;font-weight:700}
.app-meta{display:flex;gap:10px;font-size:13px;color:#4B5563}
.app-meta a{color:#03294E}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 8px;border-radius:4px;font-size:13px;font-weight:700;letter-spacing:.04em}
.tag.live{background:#D2FF71;color:#03294E}
.tag.prev{background:#F3F4F6;color:#03294E}
.tag.hidden{background:#F3F4F6;color:#4B5563;font-weight:600;letter-spacing:0}
.tag.ontv{background:#D1FAE5;color:#065F46;font-weight:600;letter-spacing:0;gap:6px}
.privacy{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#03294E;color:#F9F9FB;padding:10px 16px;font-size:13px;font-weight:600;border-radius:12px 12px 0 0}
.privacy span{display:inline-flex;align-items:center;gap:8px}
.card{border:1px solid #E5E7EB;border-radius:12px;background:#FFFFFF}
.dcard{border:1px solid #E5E7EB;border-radius:12px;background:#F9FAFB;overflow:hidden}
.dcard-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.muted{color:#4B5563}
.small{font-size:13px}
.lbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#03294E}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.input{height:44px;border:1px solid #D1D5DB;border-radius:8px;padding:0 12px;display:flex;align-items:center;font-size:15px;font-weight:500;background:#FFFFFF;color:#03294E}
.input.ghost{color:#9CA3AF}
.seg{align-self:flex-start;display:inline-flex;border:1px solid #D1D5DB;border-radius:8px;overflow:hidden;background:#FFFFFF}
.seg button{height:40px;padding:0 16px;border:0;border-right:1px solid #D1D5DB;background:#FFFFFF;color:#03294E;font-size:14px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button.is-on{background:#3F72DE;color:#FFFFFF}
.seg button:disabled{color:#9CA3AF;background:#F9FAFB}
.switch{width:44px;height:26px;border-radius:9999px;background:#D1D5DB;position:relative;flex:none;border:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF}
.switch.is-on{background:#3F72DE}.switch.is-on::after{left:21px}
.help{font-size:13px;color:#4B5563;font-weight:500;line-height:1.45}
/* Live room layout */
.live-grid{display:grid;grid-template-columns:304px minmax(0,1fr) 344px;min-height:880px}
.live-grid.no-drawer{grid-template-columns:304px minmax(0,1fr)}
.ros{border-right:1px solid #E5E7EB;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.ros h2,.drawer h2{margin:0;font-size:22px;font-weight:700}
.ros-row{padding:12px 10px 14px 12px;border-bottom:1px solid #E5E7EB;display:grid;grid-template-columns:56px minmax(0,1fr) 28px;gap:4px 8px}
.ros-row.is-live{background:#E6F0FF}
.ros-row.is-next{box-shadow:inset 3px 0 0 #3F72DE}
.ros-row time{font-size:12px;color:#4B5563;padding-top:3px}
.ros-row b{font-size:15px}
.ros-row .muted{font-size:13px;grid-column:2}
.ros-row .acts{grid-column:1/-1;display:flex;gap:8px;padding-left:60px}
.ros-row .acts .btn{flex:1;min-width:0;height:34px;font-size:13px;padding:0 6px;gap:6px}
.ros-row .acts .btn svg{width:15px;height:15px}
.ros-list{border:1px solid #E5E7EB;border-radius:12px;overflow:hidden}
.panes{padding:18px 20px;display:flex;flex-direction:column;gap:16px;background:#F9FAFB}
.pane-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pane{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.pane.is-live{border-color:#03294E}
.pane-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pane-head h3{margin:0;font-size:17px;font-weight:700;flex:1}
.mini{position:relative;overflow:hidden;border-radius:6px;width:100%;aspect-ratio:16/9}
.mini>.scale{position:absolute;top:0;left:0;transform-origin:0 0}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid #D1D5DB;border-radius:8px;overflow:hidden}
.trio button{height:46px;border:0;border-right:1px solid #D1D5DB;background:#FFFFFF;font-size:15px;font-weight:600;color:#03294E;display:flex;align-items:center;justify-content:center;gap:8px}
.trio button:last-child{border-right:0}
.trio button.is-on{background:#E6F0FF;box-shadow:inset 0 0 0 2px #3F72DE}
.trio button svg{width:18px;height:18px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.duo .btn{height:52px;font-size:16px}
.drawer{border-left:1px solid #E5E7EB;padding:18px 16px;display:flex;flex-direction:column;gap:14px;background:#FFFFFF}
.drawer-head{display:flex;align-items:center;justify-content:space-between}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px}
.stat span{font-size:12px;color:#4B5563}
.resp{display:flex;flex-direction:column}
.resp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 12px;border-top:1px solid #E5E7EB;background:#FFFFFF;font-size:14px;font-weight:500}
.resp-row .who{grid-column:1;font-size:12px;color:#4B5563;font-weight:500}
.resp-row.is-picked{background:#E6F0FF;box-shadow:inset 3px 0 0 #3F72DE}
.resp-row.is-hidden{background:#F9FAFB;color:#6B7280}
.resp-row.is-hidden .txt{text-decoration:line-through;text-decoration-color:#9CA3AF}
.resp-act{grid-column:1/-1;display:flex;gap:8px}
.big-time{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1}
.timer-chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 10px;border-radius:8px;border:1px solid #D1D5DB;background:#FFFFFF;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.timer-chip svg{width:16px;height:16px}
.timer-chip .ib{width:26px;height:26px;border-radius:6px;border:0;background:#F3F4F6;display:grid;place-items:center;color:#03294E;font-size:12px;font-weight:700}
.timer-chip .ib svg{width:14px;height:14px}
/* Setup shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid #E5E7EB;padding:24px 12px;display:flex;flex-direction:column;gap:4px;background:#FFFFFF}
.side .wm{display:flex;align-items:center;gap:8px;padding:0 12px 18px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.side .wm i{width:28px;height:28px;background:#3F72DE;}
.side .wm em{font-style:normal;font-size:10px;font-weight:800;background:#3F72DE;color:#FFFFFF;padding:2px 5px;border-radius:3px;letter-spacing:.06em}
.side .eng{padding:0 12px 14px;border-bottom:1px solid #E5E7EB;margin-bottom:10px}
.side .eng b{display:block;font-size:16px}
.side .eng span{font-size:13px;color:#4B5563}
.side .grp-l{padding:12px 12px 6px;font-size:12px;font-weight:800;letter-spacing:.08em}
.side a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:8px;color:#03294E;text-decoration:none;font-size:15px;font-weight:500}
.side a svg{width:18px;height:18px}
.side a.is-on{background:#E6F0FF;font-weight:700}
.only{background:#03294E;color:#F9F9FB;font-size:13px;font-weight:600;padding:8px 24px;display:flex;align-items:center;gap:8px}
.pg{padding:20px 24px 32px;display:flex;flex-direction:column;gap:18px;min-width:0}
.pg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pg-head h1{margin:2px 0 0;font-size:26px;font-weight:700}
.pg-cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:6px 0 8px}
.sec-h h2{margin:0;font-size:22px;font-weight:700}
.rb{border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;background:#FFFFFF}
.rb-row{display:grid;grid-template-columns:24px 76px 36px minmax(0,1fr) auto 28px;align-items:center;gap:10px;min-height:62px;padding:8px 16px;border-top:1px solid #E5E7EB;font-size:15px}
.rb-row:first-child{border-top:0}
.rb-row .grip{color:#9CA3AF}
.rb-row time{font-size:13px;color:#4B5563}
.rb-ic{width:34px;height:34px;border-radius:8px;background:#F3F4F6;display:grid;place-items:center}
.rb-ic svg{width:18px;height:18px}
.rb-t b{display:block;font-weight:600}
.rb-t b.is-default{color:#9CA3AF;font-weight:500;font-style:italic}
.rb-t span{font-size:13px;color:#4B5563}
.ready{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;background:#E6F0FF;font-size:13px;font-weight:600}
.ready svg{width:14px;height:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:6px;border:1px solid #D1D5DB;font-size:12.5px;font-weight:600;background:#FFFFFF}
.chip svg{width:13px;height:13px}
.rb-open{border-top:1px solid #E5E7EB;background:#F9FAFB;padding:18px 20px 20px 70px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.rb-open .full{grid-column:1/-1}
.optbox{border:1px solid #E5E7EB;border-radius:10px;background:#FFFFFF;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.optbox h4{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.optbox h4 svg{width:17px;height:17px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pal{border:1px solid #E5E7EB;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:#FFFFFF}
.pal-item{display:grid;grid-template-columns:40px minmax(0,1fr) 16px;gap:12px;align-items:center;border:1px solid #E5E7EB;border-radius:10px;padding:10px 12px}
.pal-item b{display:block;font-size:15px;font-weight:600}
.pal-item span{font-size:13px;color:#4B5563}
.pal-item.is-new{border-color:#3F72DE;box-shadow:0 0 0 1px #3F72DE}
.thumb{position:relative;border-radius:6px;overflow:hidden;border:1px solid #E5E7EB;background:#03294E}
.thumb .scale{position:absolute;top:0;left:0;transform-origin:0 0}
.span-mark{position:relative}
.scrim{position:absolute;inset:0;background:rgba(3,41,78,.4)}
.modal{position:absolute;background:#FFFFFF;border-radius:16px;box-shadow:0 20px 40px rgba(3,41,78,.25);display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #E5E7EB}
.modal-head h2{margin:0;font-size:22px;font-weight:700}
.modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid #E5E7EB;background:#F9FAFB}
.drop{border:2px dashed #99C5FE;border-radius:12px;background:#F5F9FF;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.order-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.order-item{border:1px solid #E5E7EB;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;background:#FFFFFF}
.order-item.is-drag{box-shadow:0 10px 24px rgba(3,41,78,.18);border-color:#3F72DE;transform:rotate(-1.5deg)}
.order-item .between{font-size:13px;font-weight:600}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#03294E;color:#FFFFFF;font-size:12px;font-weight:700}
.remote{width:390px;height:844px;overflow:hidden;background:#F9F9FB;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#03294E;display:flex;flex-direction:column}
.remote-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#FFFFFF;border-bottom:1px solid #E5E7EB}
.remote-body{padding:14px 16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.rbtn{height:56px;border-radius:12px;border:1px solid #D1D5DB;background:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:600;color:#03294E;font-family:inherit}
.rbtn.primary{background:#3F72DE;border-color:#3F72DE;color:#FFFFFF}
.rbtn svg{width:20px;height:20px}


.mk{display:block;flex:none}
/* Join frame */
.tv.has-frame .tv-main{padding-bottom:248px}
.tv.has-frame .hl{font-size:64px!important}
.tv.has-frame .eyebrow{font-size:40px}
.tv.has-frame .qa{gap:16px;padding-top:24px}
.tv.has-frame .qa-row{grid-template-columns:112px minmax(0,1fr);padding:12px 24px 12px 12px}
.tv.has-frame .qa-row b{height:80px;font-size:52px}
.tv.has-frame .qa-row p{font-size:48px}
.tv.has-frame .cloud{padding-top:8px}
.tv.has-frame .cloud .w3{font-size:150px}.tv.has-frame .cloud .w2{font-size:112px}.tv.has-frame .cloud .w1{font-size:80px}
.frame{position:absolute;left:0;right:0;bottom:0;height:216px;background:var(--card);color:var(--on-card);display:flex;align-items:center;justify-content:space-between;padding:0 96px;gap:48px}
.frame-l{display:flex;flex-direction:column;gap:6px;min-width:0}
.frame-k{margin:0;font-size:36px;font-weight:600;letter-spacing:.02em;opacity:.78}
.frame-link{margin:0;font-size:92px;line-height:1;font-weight:800;letter-spacing:-.015em;white-space:nowrap}
.frame-link span{opacity:.62;font-weight:600}
.frame-r{display:flex;align-items:center;gap:32px}
.frame-or{margin:0;font-size:34px;font-weight:600;opacity:.78;text-align:right;line-height:1.25}
.frame-r svg.qr{width:176px;height:176px;flex:none;background:#FFFFFF;padding:10px;border-radius:var(--r-chip)}
/* Q&A on the TV */
.qa{display:flex;flex-direction:column;gap:22px;padding-top:36px}
.qa-row{display:grid;grid-template-columns:132px minmax(0,1fr);align-items:center;gap:32px;padding:18px 28px 18px 18px;border-radius:var(--r-card);background:var(--panel);color:var(--on-panel)}
.qa-row b{display:grid;place-items:center;height:96px;border-radius:calc(var(--r-card) - 4px);background:var(--surface);color:var(--text);font-size:60px;font-variant-numeric:tabular-nums}
.qa-row p{margin:0;font-size:56px;line-height:1.18;font-weight:600}
.qa-row.is-top b{background:var(--callout);color:var(--on-callout)}
/* Word cloud on the TV */
.cloud{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:10px 48px;padding:24px 80px 0}
.cloud span{line-height:1.05;font-weight:700}
.cloud .w1{font-size:92px;color:var(--muted);font-weight:600}
.cloud .w2{font-size:132px;color:var(--text)}
.cloud .w3{font-size:176px;color:var(--callout)}
/* Scale as a track on the TV */
.sc-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 8px}
.sc-plot{position:relative;height:400px}
.sc-col{position:absolute;bottom:0;display:flex;flex-direction:column-reverse;align-items:center;gap:14px;width:84px;margin-left:-42px}
.sc-dot{width:76px;height:76px;border-radius:50%;background:var(--bar)}
.sc-dot.is-new{background:var(--live)}
.sc-avg{position:absolute;bottom:-40px;top:-8px;width:0;border-left:4px dashed var(--callout)}
.sc-avg-chip{position:absolute;top:-8px;left:16px;display:inline-flex;align-items:baseline;gap:12px;padding:6px 18px;border-radius:var(--r-chip);background:var(--callout);color:var(--on-callout);font-size:52px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.sc-avg-chip small{font-size:30px;font-weight:700}
.sc-track{position:relative;height:16px;border-radius:999px;background:var(--bar-track);margin-top:40px}
.sc-tick{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 4px var(--border-strong)}
.sc-nums{position:relative;height:72px;margin-top:22px}
.sc-nums span{position:absolute;width:80px;margin-left:-40px;text-align:center;font-size:54px;font-weight:700;font-variant-numeric:tabular-nums}
.sc-ends{display:flex;justify-content:space-between;font-size:38px;color:var(--muted);margin-top:4px}
.big-avg{display:flex;align-items:baseline;gap:20px}
.big-avg b{font-size:132px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
.big-avg span{font-size:44px;color:var(--muted)}
.hl-row{display:flex;align-items:flex-end;justify-content:space-between;gap:48px}
/* Before and after */
.ba{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:56px;padding:0 24px}
.ba-row{display:grid;grid-template-columns:360px minmax(0,1fr);gap:40px;align-items:center}
.ba-lab b{display:block;font-size:56px;font-weight:800}
.ba-lab span{display:block;font-size:40px;color:var(--muted)}
.ba-lab em{display:block;font-style:normal;font-size:96px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.ba-plot{position:relative;height:170px}
.ba-plot .line{position:absolute;left:0;right:0;bottom:30px;height:12px;border-radius:999px;background:var(--bar-track)}
.ba-plot .d{position:absolute;width:44px;height:44px;margin-left:-22px;border-radius:50%}
.ba-row.is-before .d{box-shadow:inset 0 0 0 5px var(--muted)}
.ba-row.is-after .d{background:var(--bar)}
.ba-plot .avg{position:absolute;bottom:0;height:170px;border-left:4px solid var(--text)}
.ba-row.is-after .avg{border-left:4px dashed var(--callout)}
.ba-axis{display:grid;grid-template-columns:360px minmax(0,1fr);gap:40px}
.ba-axis div{position:relative;height:60px}
.ba-axis span{position:absolute;width:80px;margin-left:-40px;text-align:center;font-size:44px;font-weight:700;color:var(--muted)}
.ba-shift{align-self:flex-end;display:inline-flex;align-items:center;gap:18px;padding:12px 28px;border-radius:var(--r-chip);background:var(--callout);color:var(--on-callout);font-size:60px;font-weight:800}
.ba-shift svg{width:56px;height:56px}
.b1{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.b1-key{align-self:flex-start;display:flex;gap:56px;font-size:44px;font-weight:600;margin:8px 0 4px}
.b1-k{display:inline-flex;align-items:center;gap:18px}
.b1-k b{font-weight:800;font-variant-numeric:tabular-nums}
.b1-plot{position:relative;height:440px}
.b1-line{position:absolute;left:0;right:0;bottom:64px;height:12px;border-radius:999px;background:var(--bar-track)}
.b1-t{position:absolute;bottom:58px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 4px var(--border-strong)}
.b1-d{position:absolute;display:inline-block;width:56px;height:56px;margin-left:-28px;border-radius:50%}
.b1-d.is-after{background:var(--bar)}
.b1-d.is-before{box-shadow:inset 0 0 0 6px var(--muted)}
.b1-k .b1-d{margin-left:0;width:44px;height:44px}
.b1-avg{position:absolute;width:0}
.b1-avg.is-after{bottom:70px;height:370px;border-left:4px dashed var(--text)}
.b1-avg.is-before{bottom:70px;height:370px;border-left:4px solid var(--muted)}
.b1-avg span{position:absolute;left:14px;white-space:nowrap;font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.b1-avg.is-after span{top:-6px;padding:4px 14px;border-radius:var(--r-chip);background:var(--card);color:var(--on-card)}
.b1-avg.is-before span{top:-6px;padding:4px 0;color:var(--muted)}
.b1-move{position:absolute;bottom:64px;height:12px;border-radius:999px;background:var(--muted)}
.b1-nums{position:relative;height:56px;margin-top:-48px}
.b1-nums span{position:absolute;width:80px;margin-left:-40px;text-align:center;font-size:44px;font-weight:700;color:var(--muted)}
.sc-plot.nps{overflow:visible;height:400px}
.sc-plot.nps .sc-dot{width:64px;height:64px}
.sc-plot.nps .sc-col{gap:10px}
.big-avg span{white-space:nowrap}
.nb{position:absolute;bottom:-40px;top:-8px;border-radius:var(--r-card)}
.nb.is-low{background:rgba(255,255,255,.03)}
.nb.is-mid{background:rgba(255,255,255,.07)}
.nb.is-high{background:rgba(255,255,255,.13)}
.nb-lab{position:absolute;top:14px;display:flex;align-items:baseline;justify-content:center;gap:14px;font-size:38px;color:var(--muted)}
.nb-lab b{font-size:56px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.sk-cw .nb.is-low{background:rgba(153,197,254,.05)}.sk-cw .nb.is-mid{background:rgba(153,197,254,.11)}.sk-cw .nb.is-high{background:rgba(153,197,254,.2)}
.pr-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pr-key{align-self:flex-start;display:flex;align-items:center;gap:56px;font-size:44px;font-weight:600;margin:0 0 28px}
.pr-count{margin-left:auto;font-size:44px;color:var(--muted)}
.pr-count b{color:var(--text);font-weight:800}
.pr-plot{position:relative}
.pr-grid{position:absolute;top:-12px;bottom:-12px;width:2px;margin-left:-1px;background:var(--border)}
.pr{position:absolute;left:0;right:0;height:46px}
.pr-line{position:absolute;top:50%;height:8px;margin-top:-4px;background:var(--bar);border-radius:999px}
.pr-b,.pr-a{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%}
.pr-b{background:var(--surface);box-shadow:inset 0 0 0 5px var(--muted)}
.pr-a{background:var(--bar);box-shadow:0 0 0 4px var(--surface)}
.pr-a.is-same{box-shadow:0 0 0 4px var(--surface),0 0 0 9px var(--muted)}
/* Video */
.vid{position:absolute;inset:0;background:#0B0D10;display:grid;place-items:center}
.vid-ph{width:1600px;height:900px;border:3px dashed rgba(247,246,243,.35);display:grid;place-items:center;text-align:center;color:#C6C2BA;font-size:44px;font-weight:600;line-height:1.4}
.vid-ph b{display:block;font-size:64px;color:#F7F6F3}
/* Private on the TV */
.priv{flex:1;min-height:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:40px}
.priv-n{display:flex;align-items:baseline;gap:28px}
.priv-n b{font-size:220px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.priv-n span{font-size:60px;color:var(--muted)}
.priv-line{display:inline-flex;align-items:center;gap:22px;font-size:56px;font-weight:600;color:var(--text)}
.priv-line svg{width:60px;height:60px;color:var(--muted)}
/* Phones, added */
.ph-mk{display:inline-flex}
.ph-slider{padding:8px 4px 0}
.ph-val{display:flex;align-items:baseline;justify-content:space-between}
.ph-val b{font-size:56px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.ph-trk{position:relative;height:10px;border-radius:999px;background:var(--ph-border);margin:26px 4px 10px}
.ph-trk i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--btn)}
.ph-trk em{position:absolute;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:var(--ph-card);box-shadow:0 0 0 3px var(--btn),0 4px 10px rgba(0,0,0,.18)}
.ph-ticks{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ph-muted);padding:0 0 0 2px}
.ph-ends{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--ph-muted);margin-top:8px}
.ph-ends span:last-child{text-align:right}
.ph-sent{display:flex;align-items:center;gap:8px;margin:0;font-size:15px;font-weight:600;color:var(--ph-text)}
.ph-sent svg{width:18px;height:18px;flex:none}
.ph-opt.is-on{box-shadow:inset 0 0 0 2px var(--btn);border-color:transparent}
.ph-opt.is-on i{background:var(--btn);box-shadow:none;display:grid;place-items:center}
.ph-opt.is-on i svg{width:14px;height:14px;color:#FFFFFF}
.ph-rank{display:grid;grid-template-columns:32px minmax(0,1fr) 44px;align-items:center;gap:10px;min-height:56px;padding:0 6px 0 12px;border-radius:var(--r-btn);background:var(--ph-card);color:var(--ph-on-card);border:1px solid var(--ph-border);font-size:16px;font-weight:600}
.ph-rank b{display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-btn);background:var(--btn);color:var(--on-btn);font-size:14px}
.ph-rank.is-empty b{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ph-strong)}
.ph-up{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;color:var(--ph-text)}
.ph-sec{margin:4px 0 0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ph-muted)}
.ph-watch{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:22px 18px;border-radius:calc(var(--r-card) - 4px);background:var(--ph-card);color:var(--ph-on-card);border:1px solid var(--ph-border)}
.ph-watch svg{width:36px;height:36px}
.ph-watch p{margin:0;font-size:18px;font-weight:600;line-height:1.4}
.ph-mine{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ph-mine div{border-radius:calc(var(--r-card) - 4px);background:var(--ph-card);color:var(--ph-on-card);border:1px solid var(--ph-border);padding:14px}
.ph-mine span{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ph-muted)}
.ph-mine b{display:block;font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
/* Laptop participant screen */
.lap{width:1280px;height:800px;overflow:hidden;background:var(--ph-bg);color:var(--ph-text);font-family:var(--f);display:flex;flex-direction:column}
.lap-head{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--ph-border)}
.lap-head .ph-church{font-size:16px}
.lap-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;max-width:1120px;width:100%;margin:0 auto;padding:56px 40px 40px;align-items:start}
.lap-h{margin:0;font-size:40px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.lap-p{margin:16px 0 0;font-size:18px;line-height:1.55;color:var(--ph-muted)}
.lap-card{display:flex;flex-direction:column;gap:14px}
.lap-input{min-height:260px;border-radius:var(--r-btn);background:var(--ph-input);box-shadow:inset 0 0 0 2px var(--ph-strong);padding:18px 20px;font-size:20px;line-height:1.5;color:var(--ph-on-card)}
.lap-input .cur{display:inline-block;width:2px;height:24px;background:var(--ph-on-card);vertical-align:-4px;margin-left:2px}
.lap-row{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:14px;color:var(--ph-muted)}
.kbd{display:inline-flex;align-items:center;height:24px;padding:0 7px;border-radius:4px;border:1px solid var(--ph-strong);font-size:13px;font-weight:700;color:var(--ph-text)}
.lap .ph-btn{width:auto;padding:0 28px}
.lap-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lap-opts .ph-opt{height:72px;font-size:19px;text-align:left}
.ph-opt{text-align:left;font-family:var(--f)}
.ph-btn svg{width:18px;height:18px}
.lap-back{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--ph-text);text-decoration:underline}
/* App additions */
.btn.golive{background:#03294E;border-color:#03294E;color:#FFFFFF;padding:0 18px 0 6px;height:52px;font-size:16px}
.btn.golive .tile{width:40px;height:40px;border-radius:6px;background:#F15025;display:grid;place-items:center}
.btn.golive .tile svg{width:20px;height:20px;color:#FCFCFD}
.btn.toggle-on{background:#E6F0FF;border-color:#3F72DE;box-shadow:inset 0 0 0 1px #3F72DE}
.kb{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:4px;background:#F3F4F6;border:1px solid #D1D5DB;font-size:12px;font-weight:700;color:#4B5563}
.transport{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border:1px solid #E5E7EB;border-radius:12px;background:#FFFFFF}
.transport .grp-b{display:flex;align-items:center;gap:10px}
.sep{width:1px;height:36px;background:#E5E7EB}
.lock{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:4px;background:#03294E;color:#F9F9FB;font-size:12px;font-weight:700}
.lock svg{width:12px;height:12px}
.toast{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;border-radius:10px;background:#03294E;color:#F9F9FB;font-size:14px;font-weight:600}
.toast svg{width:18px;height:18px;flex:none}
.seg button svg{width:16px;height:16px}
.seg button{display:inline-flex;align-items:center;gap:8px}
.toast button{background:transparent;border:0;color:#99C5FE;font-weight:700;text-decoration:underline;font-size:14px}
.cols10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;align-items:end;height:150px}
.cols10 div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;font-weight:700;color:#4B5563}
.cols10 i{display:block;width:100%;border-radius:4px 4px 0 0;background:#3F72DE}
.cols10 i.z{background:#E5E7EB;height:3px}
.axis10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;text-align:center;font-size:13px;font-weight:700;border-top:1px solid #D1D5DB;padding-top:6px}
.vthumb{position:relative;border-radius:8px;background:#0B0D10;aspect-ratio:16/9;display:grid;place-items:center;color:#C6C2BA;font-size:13px;font-weight:600;border:2px dashed #6B7280;text-align:center;padding:12px}
.scrub{position:relative;height:6px;border-radius:999px;background:#E5E7EB}
.scrub i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#3F72DE}
.scrub em{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 2px #3F72DE}
.menu{position:absolute;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:10px;box-shadow:0 12px 28px rgba(3,41,78,.18);padding:6px;display:flex;flex-direction:column;min-width:260px}
.menu a{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:6px;color:#03294E;text-decoration:none;font-size:14px;font-weight:500}
.menu a svg{width:16px;height:16px}
.menu a.is-hl{background:#E6F0FF;font-weight:700}
.menu hr{border:0;border-top:1px solid #E5E7EB;margin:6px 0}
.radio{display:flex;align-items:flex-start;gap:10px;font-size:14px;font-weight:600}
.radio i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px #9CA3AF;flex:none;margin-top:1px}
.radio.is-on i{box-shadow:inset 0 0 0 6px #3F72DE}
.radio span{display:block;font-weight:500;color:#4B5563;font-size:13px;margin-top:2px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.check i{width:20px;height:20px;border-radius:4px;background:#3F72DE;display:grid;place-items:center;flex:none}
.check i svg{width:14px;height:14px;color:#FFFFFF}
.check.is-off i{background:#FFFFFF;box-shadow:inset 0 0 0 2px #9CA3AF}
.elist{border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;background:#FFFFFF}
.erow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 140px 120px 44px;align-items:center;gap:16px;min-height:64px;padding:8px 18px;border-top:1px solid #E5E7EB;font-size:14px}
.erow:first-child{border-top:0;min-height:44px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#4B5563;background:#F9FAFB}
.erow b{display:block;font-size:15px}
.erow span{color:#4B5563;font-size:13px}
.ib2{width:36px;height:36px;border-radius:8px;border:1px solid #D1D5DB;background:#FFFFFF;display:grid;place-items:center;color:#03294E}
.ib2 svg{width:18px;height:18px}
.story{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px;padding:56px 64px;background:#FFFFFF;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#03294E;width:1920px;height:620px}
.story>div>h3{margin:16px 0 6px;font-size:28px;font-weight:700}
.story>div>p{margin:0;font-size:20px;line-height:1.5;color:#4B5563}
.story .mini{border-radius:8px;border:1px solid #E5E7EB}
